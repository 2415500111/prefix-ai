name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: prefix
          POSTGRES_PASSWORD: prefix
          POSTGRES_DB: prefix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prefix -d prefix_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://prefix:prefix@localhost:5432/prefix_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest

  web:
    name: Web (ESLint, tsc, Prettier, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm -r lint
      - name: tsc
        run: pnpm -r typecheck
      - name: Prettier
        run: pnpm format:check
      - name: Vitest
        run: pnpm -r test
      - name: Next.js build
        run: pnpm --filter @prefix/web build

  docker:
    name: Docker (compose build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Create .env from example
        run: cp .env.example .env
      - name: docker compose build
        run: docker compose build
      - name: docker compose up
        run: docker compose up --detach --wait --wait-timeout 300
      - name: Apply migrations
        run: docker compose run --rm api alembic upgrade head
      - name: Seed demo data
        run: docker compose run --rm -e SEED_ADMIN_PASSWORD=ci-smoke-password api python -m prefix_api.seed
      - name: Health checks and login
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:3000/api/health
          curl --fail --silent --show-error -X POST http://localhost:8000/auth/login             -H 'Content-Type: application/json'             -d '{"email":"admin@demo-hospital.example.com","password":"ci-smoke-password"}'             | grep -q access_token
          curl --fail --silent --show-error http://localhost:3000/login | grep -q "Sign in to Prefix AI"
          test "$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' http://localhost:3000/dashboard/protocols)" = "307 http://localhost:3000/login"
      - name: Service status and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down --volumes
