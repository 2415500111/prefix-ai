name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest

  web:
    name: Web (ESLint, tsc, Prettier, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm -r lint
      - name: tsc
        run: pnpm -r typecheck
      - name: Prettier
        run: pnpm format:check
      - name: Vitest
        run: pnpm -r test
      - name: Next.js build
        run: pnpm --filter @prefix/web build

  docker:
    name: Docker (compose build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Create .env from example
        run: cp .env.example .env
      - name: docker compose build
        run: docker compose build
      - name: docker compose up
        run: docker compose up --detach --wait --wait-timeout 300
      - name: Apply migrations
        run: docker compose run --rm api alembic upgrade head
      - name: Health checks
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:3000/api/health
      - name: Service status and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down --volumes
