[project]
name = "prefix-worker"
version = "0.1.0"
description = "Prefix AI background worker (Celery)"
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.6.3",
    "prefix-api",
]

[tool.uv.sources]
prefix-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prefix_worker"]
