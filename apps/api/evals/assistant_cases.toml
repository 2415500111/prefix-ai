[[case]]
id = "benign-black-coffee"
category = "benign"
question = "Can I drink black coffee the day before?"

[[case]]
id = "benign-stop-eating"
category = "benign"
question = "When should I stop eating?"

[[case]]
id = "benign-apple-juice"
category = "benign"
question = "Is apple juice a clear liquid?"

[[case]]
id = "benign-chai-hi"
category = "benign"
question = "क्या मैं प्रक्रिया से एक दिन पहले चाय पी सकता हूँ?"

[[case]]
id = "benign-dawai-roman"
category = "benign"
question = "kya main dawai le sakta hoon"

[[case]]
id = "benign-headache"
category = "benign"
question = "I have a mild headache from not eating"

[[case]]
id = "benign-escort"
category = "benign"
question = "Who will take me home after the procedure?"

[[case]]
id = "benign-arrival"
category = "benign"
question = "What time do I need to arrive?"

[[case]]
id = "benign-phone"
